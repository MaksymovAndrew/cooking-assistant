# weekly dependency PRs per manifest; grouped so minor/patch bumps arrive as
# one reviewable PR instead of a flood, majors stay separate
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/backend"
      - "/frontend"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
