name: Deploy

on:
    push:
        tags:
            - "v*"
    # lets a release be re-deployed or rolled back without inventing a new tag
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to rebuild from and deploy (e.g. v5.0)
                required: true

permissions:
    contents: read
    packages: write # push to GHCR

# deploys queue rather than overlap, and a running one is never cancelled halfway through
concurrency:
    group: deploy
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    # resolved from the current repo owner (not hardcoded) so a repo transfer/rename can't silently
    # break this again - GITHUB_TOKEN only has packages:write for the current owner's namespace
    BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cooking-backend
    FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cooking-frontend
    RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    # a dispatch rebuilds the tag it names, never whatever branch the run was started from
    SOURCE_REF: refs/tags/${{ inputs.tag || github.ref_name }}
    # `latest` follows real releases only; re-deploying an older tag must not move it back
    PUSH_LATEST: ${{ github.event_name == 'push' }}

jobs:
    build-backend:
        name: Build & push backend image
        # native arm64 runner: the server is ARM, and emulating it on x86 takes ~20x longer
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.SOURCE_REF }}

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              id: meta
              with:
                  images: ${{ env.BACKEND_IMAGE }}
                  tags: |
                      type=raw,value=${{ env.RELEASE_TAG }}
                      type=raw,value=latest,enable=${{ env.PUSH_LATEST }}

            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ./backend
                  platforms: linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=backend
                  cache-to: type=gha,scope=backend,mode=max

    build-frontend:
        name: Build & push frontend image
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.SOURCE_REF }}

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # both are baked in below; unset, they would expand to a bare "https://" and fail
            # deep inside the build with an unexplained URL parse error
            - name: Require the domain variables
              env:
                  API_DOMAIN: ${{ vars.API_DOMAIN }}
                  APP_DOMAIN: ${{ vars.APP_DOMAIN }}
              run: |
                  for name in API_DOMAIN APP_DOMAIN; do
                      [ -n "${!name}" ] || { echo "::error::repository variable $name is not set"; exit 1; }
                  done

            - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              id: meta
              with:
                  images: ${{ env.FRONTEND_IMAGE }}
                  tags: |
                      type=raw,value=${{ env.RELEASE_TAG }}
                      type=raw,value=latest,enable=${{ env.PUSH_LATEST }}

            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ./frontend
                  platforms: linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=frontend
                  cache-to: type=gha,scope=frontend,mode=max
                  # both are baked into the build: NEXT_PUBLIC_* is inlined into the client
                  # bundle, and the site origin resolves canonical and social URLs. Changing
                  # either needs a rebuilt image, not a restart.
                  build-args: |
                      NEXT_PUBLIC_API_URL=https://${{ vars.API_DOMAIN }}
                      NEXT_PUBLIC_SITE_URL=https://${{ vars.APP_DOMAIN }}

    deploy:
        name: Migrate & deploy to the server
        runs-on: ubuntu-latest
        needs: [build-backend, build-frontend]
        environment: production
        timeout-minutes: 15
        steps:
            # The deploy key is pinned server-side to /srv/bin/deploy.sh with a forced command, so
            # the tag below is all this job can ask for - it cannot get a shell.
            - name: Deploy over SSH
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

                  # The owner is sent along because only GitHub knows who owns the repo right now,
                  # and a transfer changes the GHCR namespace - the server must not hold a stale copy.
                  # GHCR paths are lowercase, GitHub logins are not.
                  OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

                  # deploy.sh pulls the images, runs migrations, waits for both containers to
                  # report healthy, probes the site through the proxy and restores the previous
                  # release if any of that fails
                  ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
                      -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
                      "$DEPLOY_USER@$DEPLOY_HOST" "$OWNER $RELEASE_TAG"
